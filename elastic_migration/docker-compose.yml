version: '3.8'

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.2
    container_name: elasticsearch
    environment:
      - discovery.type=single-node
      # Yerel test ortamında SSL/Şifre zorunluluğunu atlamak için security'yi kapatıyoruz.
      - xpack.security.enabled=false 
      # Kritik Kısıtlama: RAM Limiti
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "9200:9200"
    # Container bazlı maksimum bellek limiti
    mem_limit: 2g
    volumes:
      - es_data:/usr/share/elasticsearch/data
    networks:
      - elastic_net

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.2
    container_name: kibana
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch
    networks:
      - elastic_net

volumes:
  es_data:
    driver: local

networks:
  elastic_net:
    driver: bridge
