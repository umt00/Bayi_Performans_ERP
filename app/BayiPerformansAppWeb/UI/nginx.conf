server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Gzip sıkıştırma
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/json;

    # Single Page Application yönlendirmesi
    location / {
        try_files $uri $uri/ /index.html;
    }

    # .NET Backend API Proxy
    location ~ ^/(api|auth|bayi|bayiler|stok|urunler|depolar|tanimlar|jobs|satis)/ {
        proxy_pass http://api:10000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI Proxy (Teklifler & Değerlendirme)
    location ~ ^/(teklifler|teklif-olustur|health/ready|cache)/ {
        proxy_pass http://fastapi:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # UI Container Healthcheck
    location /healthz {
        access_log off;
        return 200 "healthy\n";
    }
}
