services:
  - type: keyvalue
    name: bayi-performans-otp-redis
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: volatile-ttl
    persistenceMode: off

  - type: web
    name: bayi-performans-api
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./app/BayiPerformansAppWeb/Dockerfile.api
    dockerContext: ./app/BayiPerformansAppWeb
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: DOTNET_USE_POLLING_FILE_WATCHER
        value: "true"
      - key: Swagger__Enabled
        value: "true"
      - key: BackgroundJobs__ScoreCalculationEnabled
        value: "false"
      - key: Elasticsearch__Enabled
        value: "false"
      - key: Redis__ConnectionString
        fromService:
          type: keyvalue
          name: bayi-performans-otp-redis
          property: connectionString
      - key: Redis__AllowInMemoryFallback
        value: "false"
      - key: PGSSLROOTCERT
        value: /etc/secrets/prod-ca-2021.crt
      - key: Database__ConnectionString
        sync: false
      - key: SupabaseAuth__ProjectUrl
        sync: false
      - key: SupabaseAuth__PublishableKey
        sync: false
      - key: Cors__AllowedOrigins__0
        sync: false
      - key: BrevoEmail__Enabled
        value: "true"
      - key: BrevoEmail__ApiKey
        sync: false
      - key: BrevoEmail__FromEmail
        sync: false
      - key: BrevoEmail__FromName
        value: Bayi Performans

  - type: web
    name: bayi-performans-fastapi
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: off
    envVars:
      - key: PORT
        value: "8000"
      - key: SUPABASE_DB_URL
        sync: false
      - key: REQUIRE_AUTH
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        value: "https://penta-intern-project.vercel.app"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: "https://api.groq.com/openai/v1"
      - key: GROQ_MODEL
        value: "openai/gpt-oss-120b"
